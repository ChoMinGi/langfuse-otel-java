services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.0.0-rc.2@sha256:2c05199c79d213db2d70e5bac6347a9e11294e441e5f6579ffee3e05031b51e9
    restart: "no"
    depends_on: &langfuse-dependencies
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-environment
      NEXTAUTH_URL: http://langfuse-web:3000
      DATABASE_URL: postgresql://postgres:${LANGFUSE_E2E_POSTGRES_PASSWORD:?LANGFUSE_E2E_POSTGRES_PASSWORD is required}@postgres:5432/postgres
      SALT: ${LANGFUSE_E2E_SALT:?LANGFUSE_E2E_SALT is required}
      ENCRYPTION_KEY: ${LANGFUSE_E2E_ENCRYPTION_KEY:?LANGFUSE_E2E_ENCRYPTION_KEY is required}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_E2E_CLICKHOUSE_PASSWORD:?LANGFUSE_E2E_CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_USE_AZURE_BLOB: "false"
      LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_E2E_MINIO_PASSWORD:?LANGFUSE_E2E_MINIO_PASSWORD is required}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_E2E_MINIO_PASSWORD:?LANGFUSE_E2E_MINIO_PASSWORD is required}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_E2E_REDIS_PASSWORD:?LANGFUSE_E2E_REDIS_PASSWORD is required}
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: "false"

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.0.0-rc.2@sha256:56c42e91b636690b33c524b7785be6305f125e7c52cfdbf6007f77cba175e87e
    restart: "no"
    depends_on: *langfuse-dependencies
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_E2E_NEXTAUTH_SECRET:?LANGFUSE_E2E_NEXTAUTH_SECRET is required}
      LANGFUSE_INIT_ORG_ID: langfuse-otel-java-e2e-org
      LANGFUSE_INIT_ORG_NAME: langfuse-otel-java-e2e
      LANGFUSE_INIT_PROJECT_ID: langfuse-otel-java-e2e-project
      LANGFUSE_INIT_PROJECT_NAME: langfuse-otel-java-e2e
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY is required}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY is required}
      LANGFUSE_INIT_USER_EMAIL: e2e@example.invalid
      LANGFUSE_INIT_USER_NAME: Docker E2E
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_E2E_INIT_PASSWORD:?LANGFUSE_E2E_INIT_PASSWORD is required}

  tls-proxy:
    image: docker.io/nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: "no"
    depends_on:
      - langfuse-web
    ports:
      - "127.0.0.1::443"
    volumes:
      - type: bind
        source: ${LANGFUSE_E2E_CERT_DIR:?LANGFUSE_E2E_CERT_DIR is required}/server.crt
        target: /etc/nginx/e2e-server.crt
        read_only: true
      - type: bind
        source: ${LANGFUSE_E2E_CERT_DIR:?LANGFUSE_E2E_CERT_DIR is required}/server.key
        target: /etc/nginx/e2e-server.key
        read_only: true
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: "no"
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_E2E_CLICKHOUSE_PASSWORD:?LANGFUSE_E2E_CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2s

  minio:
    image: cgr.dev/chainguard/minio@sha256:fa23f6a6f62645654530ff94aa077d1cc0d0e44c8f1cce02ab039873612edc72
    restart: "no"
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_E2E_MINIO_PASSWORD:?LANGFUSE_E2E_MINIO_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  redis:
    image: docker.io/redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
    restart: "no"
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_E2E_REDIS_PASSWORD:?LANGFUSE_E2E_REDIS_PASSWORD is required}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${LANGFUSE_E2E_REDIS_PASSWORD:?LANGFUSE_E2E_REDIS_PASSWORD is required}
        - ping
      interval: 3s
      timeout: 5s
      retries: 15

  postgres:
    image: docker.io/postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_E2E_POSTGRES_PASSWORD:?LANGFUSE_E2E_POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
  redis-data:
