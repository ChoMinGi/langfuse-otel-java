name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and supply chain
    uses: ./.github/workflows/quality.yml

  verify:
    name: verify (Java 17, package + Javadoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Clean verify
        run: ./mvnw -B -ntp clean verify

      - name: Verify coverage artifacts
        run: |
          test -s langfuse-otel-core/target/jacoco.exec
          test -s langfuse-otel-core/target/site/jacoco/jacoco.xml
          test -s langfuse-otel-spring-boot-starter/target/jacoco.exec
          test -s langfuse-otel-spring-boot-starter/target/site/jacoco/jacoco.xml

  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Core Unit Test
        run: ./mvnw -B -ntp test -pl langfuse-otel-core -am

  starter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline: minimum supported, security-patched versions
          - java: 17
            spring-ai-version: '1.0.9'
            langchain4j-version: '1.0.0'
          - java: 21
            spring-ai-version: '1.0.9'
            langchain4j-version: '1.0.0'
          # Latest stable releases on the Spring AI 1.x line and LangChain4j
          - java: 17
            spring-ai-version: '1.1.8'
            langchain4j-version: '1.18.0'
          - java: 21
            spring-ai-version: '1.1.8'
            langchain4j-version: '1.18.0'
    name: starter (java-${{ matrix.java }}, spring-ai-${{ matrix.spring-ai-version }}, lc4j-${{ matrix.langchain4j-version }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Starter Unit Test
        run: >-
          ./mvnw -B -ntp test
          -pl langfuse-otel-spring-boot-starter -am
          -Dspring-ai.version=${{ matrix.spring-ai-version }}
          -Dlangchain4j.version=${{ matrix.langchain4j-version }}

  consumer-smoke:
    name: consumer examples
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install reactor artifacts locally
        run: ./mvnw -B -ntp -DskipTests -Djacoco.skip=true install

      - name: Compile Spring AI consumer
        run: ./mvnw -B -ntp -f examples/spring-ai-example/pom.xml -DskipTests verify

      - name: Compile LangChain4j consumer
        run: ./mvnw -B -ntp -f examples/langchain4j-example/pom.xml -DskipTests verify

      - name: Verify Spring AI consumer (external and standalone, 1.0.9)
        run: ./mvnw -B -ntp -f consumer-tests/spring-boot-consumer/pom.xml verify

      - name: Verify Spring AI consumer (external and standalone, 1.1.8)
        run: >-
          ./mvnw -B -ntp -f consumer-tests/spring-boot-consumer/pom.xml
          -Dspring-ai.version=1.1.8 clean verify

      - name: Verify LangChain4j consumer (external and standalone, 1.0.0)
        run: ./mvnw -B -ntp -f consumer-tests/langchain4j-spring-boot-consumer/pom.xml verify

      - name: Verify LangChain4j consumer (external and standalone, 1.18.0)
        run: >-
          ./mvnw -B -ntp -f consumer-tests/langchain4j-spring-boot-consumer/pom.xml
          -Dlangchain4j.version=1.18.0 clean verify

      - name: Verify core and prompt client compatibility
        run: ./mvnw -B -ntp -f consumer-tests/core-prompt-consumer/pom.xml verify

  integration-status:
    name: live export smoke status (explicit opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, verify, core, starter, consumer-smoke]
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    env:
      INTEGRATION_ENABLED: ${{ vars.LANGFUSE_INTEGRATION_ENABLED }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_TEST_PROMPT_NAME: ${{ secrets.LANGFUSE_TEST_PROMPT_NAME }}
    steps:
      - name: Report live integration configuration
        id: configuration
        shell: bash
        run: |
          if [[ "${INTEGRATION_ENABLED,,}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Live Langfuse export smoke: not run"
              echo
              echo "Set the repository variable \`LANGFUSE_INTEGRATION_ENABLED=true\` to opt in."
              echo "Ordinary PR and main CI remain independent of live credentials."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$LANGFUSE_PUBLIC_KEY" || -z "$LANGFUSE_SECRET_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Live integration is enabled, but LANGFUSE_PUBLIC_KEY or LANGFUSE_SECRET_KEY is missing."
            {
              echo "### Live Langfuse export smoke: configuration error"
              echo
              echo "The explicit opt-in is enabled, but required credentials are incomplete."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Live Langfuse export smoke: enabled"
            echo
            echo "The live exporter exercise will run after the offline quality gates."
            echo "It verifies the client path and flush call, not Langfuse ingestion read-back."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$LANGFUSE_TEST_PROMPT_NAME" ]]; then
            echo "::notice::LANGFUSE_TEST_PROMPT_NAME is absent; the prompt-specific integration case will be skipped."
          fi

  integration-test:
    name: live Langfuse export smoke (no read-back)
    runs-on: ubuntu-latest
    needs: [integration-status]
    if: needs.integration-status.outputs.enabled == 'true'
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_TEST_PROMPT_NAME: ${{ secrets.LANGFUSE_TEST_PROMPT_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Exercise live exporter
        run: ./mvnw -B -ntp test -pl langfuse-otel-core -am -DexcludedGroups= -Dgroups=integration

      - name: Record live export smoke result
        if: always()
        shell: bash
        run: |
          echo "### Live Langfuse export smoke: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This status does not prove ingestion; no Langfuse API read-back is performed." >> "$GITHUB_STEP_SUMMARY"
