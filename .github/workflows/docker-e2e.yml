name: Docker E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-readback:
    name: Spring AI and LangChain4j read-back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run the disposable Langfuse stack and framework read-back
        run: ./e2e/langfuse-docker/run.sh
