name: Observation v4 read-back

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to verify
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    name: Langfuse 4.41.0 core read-back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install the exact core artifact
        run: ./mvnw -B -ntp -pl langfuse-otel-core -am -DskipTests -Djacoco.skip=true install

      - name: Verify explicit observations and raw helpers in Langfuse 4.41.0
        run: bash experiments/core-preflight/docker/run.sh

      - name: Retain exact-commit read-back evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observation-readback-${{ github.run_id }}
          path: |
            experiments/core-preflight/target/live-*.json
            experiments/core-preflight/target/surefire-reports/
          retention-days: 30
