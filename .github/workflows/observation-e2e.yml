name: Observation v4 read-back

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      capture_screenshot:
        description: Capture the synthetic first-trace screen for documentation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  readback:
    name: Langfuse 4.41.0 core read-back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install the exact core artifact
        run: ./mvnw -B -ntp -pl langfuse-otel-core -am -DskipTests -Djacoco.skip=true install

      - name: Verify core observations and the public first-trace quick start
        env:
          FIRST_TRACE_CAPTURE_SCREENSHOT: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_screenshot || 'false' }}
        run: bash experiments/core-preflight/docker/run.sh

      - name: Retain exact-commit read-back evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation-readback-${{ github.run_id }}
          path: |
            experiments/core-preflight/target/live-*.json
            experiments/core-preflight/target/surefire-reports/
            examples/first-trace/target/first-trace.json
            examples/first-trace/target/first-trace.png
            examples/first-trace/target/surefire-reports/
          retention-days: 30
