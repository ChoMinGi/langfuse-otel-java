name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure with...
        2. Call...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - langfuse-otel-core
        - langfuse-otel-spring-boot-starter
        - Examples
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "Published version or commit SHA"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "17"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: LLM Framework
      options:
        - Spring AI
        - LangChain4j
        - None (standalone)
        - Other
    validations:
      required: true

  - type: input
    id: framework-versions
    attributes:
      label: Framework versions
      description: Include Spring Boot and Spring AI or LangChain4j versions, or enter "n/a".
      placeholder: "Spring Boot 3.5.16, Spring AI 1.1.8"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant configuration and logs
      description: Remove API keys, credentials, model content, and other sensitive data.
      render: shell
